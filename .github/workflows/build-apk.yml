name: Build Linkz Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract prototype project
        run: |
          mkdir -p project
          unzip -q LinkzOfflinePrototype_v0_1.zip -d project
          echo "Extracted files:"
          find project -maxdepth 4 -type f | sort

      - name: Build Debug APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkzOfflinePrototype-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
