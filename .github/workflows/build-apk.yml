name: Build Linkz Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Prepare project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q LinkzOfflinePrototype_v0_5.zip -d project

          echo "===== PROJECT FILES ====="
          find project -maxdepth 5 -type f | sort

      - name: Build Debug APK
        working-directory: project
        run: |
          echo "===== BUILDING V0.4 ====="
          gradle assembleDebug

      - name: Check APK
        run: |
          echo "===== APK OUTPUT ====="
          ls -lh project/app/build/outputs/apk/debug/
          echo "===== APK INFO ====="
          unzip -p project/app/build/outputs/apk/debug/app-debug.apk \
            META-INF/MANIFEST.MF 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkzOfflinePrototype-v0.4-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
